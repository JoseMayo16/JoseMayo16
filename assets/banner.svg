<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title">
  <title id="title">Juan José, full stack developer in Medellín, Colombia. Almost 3 years of experience at Universidad de Antioquia, Pase Seguro and freelance; SENA technologist. Skills: Laravel, Vue, Python, n8n, Airtable, APIs. Interests: cybersecurity, gaming. Available for freelance.</title>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#6fd4ae"/>
      <stop offset=".55" stop-color="#7cb7ff"/>
      <stop offset="1" stop-color="#c792ea"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity=".025"/>
    </pattern>
    <radialGradient id="glow" cx=".85" cy=".2" r=".6">
      <stop offset="0" stop-color="#6fd4ae" stop-opacity=".10"/>
      <stop offset="1" stop-color="#6fd4ae" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect width="960" height="440" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 18px; fill: #e9e7e0; }
    .bar { font-size: 13px; fill: #8c8f96; }
    .p { fill: #6fd4ae; font-weight: 700; }
    .c { fill: #e9e7e0; }
    .m { fill: #8c8f96; }
    .name { fill: #ffffff; font-weight: 700; }
    .dir { fill: #7cb7ff; }
    .sec { fill: #ff7b72; }
    .fun { fill: #c792ea; }
    .ok { fill: #6fd4ae; font-weight: 700; }
    /* Visible by default; the delay only hides each line until its turn (fill-mode backwards). */
    .l { animation: show .2s ease-out backwards; }
    .l1 { animation-delay: .2s; }  .l2 { animation-delay: .6s; }
    .l3 { animation-delay: 1.1s; } .l4 { animation-delay: 1.5s; }
    .l5 { animation-delay: 2.0s; } .l6 { animation-delay: 2.4s; }
    .l7 { animation-delay: 2.9s; } .l8 { animation-delay: 3.3s; }
    .l9 { animation-delay: 3.8s; } .l10 { animation-delay: 4.2s; }
    .cur { fill: #e9e7e0; animation: blink 1.1s 4.6s steps(1) infinite backwards; }
    @keyframes show { from { opacity: 0; } }
    @keyframes blink { 0% { fill-opacity: 0; } 50% { fill-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .l, .cur { animation: none; }
    }
  </style>

  <g clip-path="url(#win)">
    <rect width="960" height="440" fill="#16181d"/>
    <rect width="960" height="440" fill="url(#glow)"/>
    <rect width="960" height="440" fill="url(#scan)"/>
    <rect width="960" height="3" fill="url(#edge)"/>
    <rect y="3" width="960" height="41" fill="#1c1f25"/>
    <rect y="44" width="960" height="1" fill="#ffffff" opacity=".07"/>
  </g>
  <rect x=".5" y=".5" width="959" height="439" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="24" r="6" fill="#febc2e"/>
  <circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text class="bar" x="480" y="28.5" text-anchor="middle">juanjose@medellin: ~</text>

  <g xml:space="preserve">
    <text class="l l1" x="36" y="88"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
    <text class="l l2" x="36" y="118"><tspan class="name">Juan José</tspan><tspan class="m">  ·  </tspan>full stack developer<tspan class="m">  ·  </tspan>Medellín, Colombia</text>

    <text class="l l3" x="36" y="160"><tspan class="p">$</tspan> <tspan class="c">cat experience.txt</tspan></text>
    <text class="l l4" x="36" y="190">~3 years: UdeA, Pase Seguro, freelance<tspan class="m">  ·  </tspan>SENA technologist</text>

    <text class="l l5" x="36" y="232"><tspan class="p">$</tspan> <tspan class="c">ls skills/</tspan></text>
    <text class="l l6" x="36" y="262"><tspan class="dir">laravel/   vue/   python/   n8n/   airtable/   apis/</tspan></text>

    <text class="l l7" x="36" y="304"><tspan class="p">$</tspan> <tspan class="c">ls interests/</tspan></text>
    <text class="l l8" x="36" y="334"><tspan class="sec">cybersecurity/</tspan>   <tspan class="fun">gaming/</tspan></text>

    <text class="l l9" x="36" y="376"><tspan class="p">$</tspan> <tspan class="c">status --freelance</tspan></text>
    <text class="l l10" x="36" y="406"><tspan class="ok">●</tspan> available for new projects <tspan class="cur">█</tspan></text>
  </g>
</svg>
